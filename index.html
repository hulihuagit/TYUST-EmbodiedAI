---
layout: default
title: 首页
---

<div class="hero">
  <h1>TYUST-EmbodiedAI</h1>
  <p class="subtitle">具身智能实验室</p>
  <p class="subtitle-en">Embodied Intelligence Lab</p>
  <p style="margin-top: 0.5rem; opacity: 0.7;">太原科技大学</p>
</div>

<div class="section">
  <h2 class="section-title">研究方向 Research Directions</h2>
  <div class="research-grid">
    {% for item in site.data.research.directions %}
    <a href="{{ '/' | relative_url }}research/{{ item.title_en | downcase | replace: ' ', '-' }}" class="research-card" style="text-decoration: none; color: inherit;">
      <div class="card-title">
        <h3>{{ item.title_zh }}</h3>
        <span class="subtitle">{{ item.title_en }}</span>
      </div>
      <p>{{ item.description_zh }}</p>
    </a>
    {% endfor %}
  </div>
</div>

<div class="section">
  <h2 class="section-title">最新动态 News</h2>
  <div class="placeholder">
    <p>暂无最新动态</p>
    <p style="font-size: 0.85rem;">No recent news yet.</p>
  </div>
</div>
