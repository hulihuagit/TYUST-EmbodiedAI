directions:
  - title_en: "Tactile Sensing"
    title_zh: "触觉感知"
    description_en: "Research on tactile sensing and perception for intelligent robots."
    description_zh: "智能机器人触觉感知与触觉交互研究。"
    projects:
      - name: "触觉摩擦检测"
        url: "/TYUST-EmbodiedAI/projects/tactile_sensing/friction-detection/"
        homepage_description: "基于深度学习的触觉摩擦检测研究，包含时频双支融合网络及KNN、ResNet、Transformer、VGG等多种网络模型的对比实验。"
      - name: "磁触觉传感器"
        url: "/TYUST-EmbodiedAI/projects/tactile_sensing/magnetic-sensor/"
        homepage_description: "基于多尺度门控交互网络(MSGI-Net)的磁触觉传感器分类研究，包含数据采集、预处理、模型训练和评估的完整流程。"
      - name: "MambaVision触觉识别"
        url: "/TYUST-EmbodiedAI/projects/tactile_sensing/mambavision-tactile/"
        homepage_description: "基于MambaVision的触觉物体识别研究，在Calandra、TAG、obj三个触觉数据集上进行对比实验。"

  - title_en: "Pose Estimation"
    title_zh: "姿态估计"
    description_en: "Human and object pose estimation for robotic manipulation."
    description_zh: "人体与物体姿态估计研究。"
    projects: []

  - title_en: "Event Camera"
    title_zh: "事件相机"
    description_en: "Vision processing with event-based cameras for dynamic scenes."
    description_zh: "基于事件相机的动态场景视觉处理研究。"
    projects:
      - name: "无人机追踪系统"
        url: "/TYUST-EmbodiedAI/projects/event_camera/UAV-Tracking-System/"
        homepage_description: "一套基于事件相机+时间表面表示的高速运动小目标检测与追踪软件平台。输入异步事件流 -> 时间表面转换 -> 多尺度检测 -> KCF+卡尔曼跟踪 -> 视频输出。支持模拟数据与FRED真实数据双模式，已封装为PySide6桌面应用。"
